BASE_YAML: "COCO-Detection/faster_rcnn_R_101_C4_3x.yaml"
DATASETS:
        TRAIN: ("daytime_clear_train",)
        TEST: ('daytime_clear_test',)
DATALOADER:
        NUM_WORKERS: 16
INPUT:
        MIN_SIZE_TRAIN: (1200,)
        MIN_SIZE_TEST: 1200
        CLIP_RANDOM_CROPS: True
        RANDOM_CROP_SIZE: 750

SOLVER:
        BASE_LR: 0.001
        MAX_ITER: 200000
        STEPS: [80000,]
        WARMUP_ITERS: 0
        IMS_PER_BATCH: 4
        CHECKPOINT_PERIOD: 500000
MODEL:
        BACKBONE:
                NAME: ClipRN101
        WEIGHTS: ""
        CLIP_IMAGE_ENCODER_NAME: 'RN101'
        META_ARCHITECTURE: 'ClipRCNNDATACMRDCOTGuard'
        NUM_CLASSES: 7

        MR_GUARD_ENABLE: True
        MR_GUARD_FORCE_BASELINE: False
        MR_GUARD_START_ITER: 100000
        MR_GUARD_WARMUP_ITERS: 50000
        MR_GUARD_MAX_ALPHA: 0.05
        MR_GUARD_GATE_INIT: -6.0

        MR_GUARD_PROTO_DIM: 256
        MR_GUARD_TEMPERATURE: 0.1
        MR_GUARD_LOCAL_WEIGHT: 0.5
        MR_GUARD_SOURCE_PROTO_WEIGHT: 0.05
        MR_GUARD_MAX_GT_ROIS: 64

        MR_GUARD_VISUAL_NOISE_STD: 0.03
        MR_GUARD_BLUR_KERNEL: 3
        MR_GUARD_VISUAL_STEPS: 2
        MR_GUARD_DROP_PROB: 0.0
        MR_GUARD_STYLE_MEAN_SCALE: 0.5
        MR_GUARD_STYLE_STD_SCALE: 0.5

        MR_GUARD_LOSS_ALIGN: 0.01
        MR_GUARD_LOSS_DIFF: 0.005
        MR_GUARD_LOSS_REG: 0.02
        MR_GUARD_LOSS_OFF_DET: 0.0
        MR_GUARD_OFF_DET_MAX_IMAGES: 2

        PROPOSAL_GENERATOR:
                NAME: 'SBRPN'
        ROI_HEADS:
                NAME: 'ClipRes5ROIHeadsAttn'
                NUM_CLASSES: 7
TEST:
        EVAL_SAVE_PERIOD: 5000
        MILESTONE_EVAL_PERIOD: 50000
        FINAL_BEST_ALL_DOMAIN: True
OUTPUT_DIR: "all_outs/diverse_weather_datac_mrdcot_guard_cons_9.2"
VIS_PERIOD: 0
OFFSET_OPT_INTERVAL: [100000]
OFFSET_OPT_ITERS: 500
OFFSET_OPT_LR: 0.01
